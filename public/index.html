<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port de Plaisance Russell</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Port de Plaisance Russell</h1>
    <p>Bienvenue sur l'application de gestion des réservations de catways</p>
  </header>

  <main>
    <section class="login-section">
      <h2>Connexion</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Votre email" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="Votre mot de passe" required>
        </div>
        <button type="submit">Se connecter</button>
        <p id="errorMessage" class="error"></p>
      </form>
    </section>

    <section class="doc-section">
      <h2>Documentation</h2>
      <p>Consultez la documentation de l'API pour en savoir plus sur les endpoints disponibles.</p>
      <a href="/api-docs" class="btn">Voir la documentation</a>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
