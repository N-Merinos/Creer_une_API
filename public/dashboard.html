<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord - Port Russell</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Port de Plaisance Russell</h1>
  </header>

  <nav>
    <a href="/catways.html">Catways</a>
    <a href="/reservations.html">Réservations</a>
    <a href="/users.html">Utilisateurs</a>
    <a href="/api-docs">Documentation API</a>
    <a href="#" id="logoutBtn">Se déconnecter</a>
  </nav>

  <main>
    <section class="section">
      <h2>Tableau de bord</h2>
      <p>Bienvenue, <strong id="username"></strong></p>
      <p>Email : <span id="userEmail"></span></p>
      <p>Date du jour : <span id="currentDate"></span></p>
    </section>

    <section class="section">
      <h2>Réservations en cours</h2>
      <table id="reservationsTable">
        <thead>
          <tr>
            <th>Catway</th>
            <th>Client</th>
            <th>Bateau</th>
            <th>Début</th>
            <th>Fin</th>
          </tr>
        </thead>
        <tbody id="reservationsBody">
        </tbody>
      </table>
    </section>
  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
