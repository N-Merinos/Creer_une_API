<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilisateurs - Port Russell</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Port de Plaisance Russell</h1>
  </header>

  <nav>
    <a href="/dashboard.html">Tableau de bord</a>
    <a href="/catways.html">Catways</a>
    <a href="/reservations.html">Réservations</a>
    <a href="/api-docs">Documentation API</a>
    <a href="#" id="logoutBtn">Se déconnecter</a>
  </nav>

  <main>
    <section class="section">
      <h2>Ajouter un utilisateur</h2>
      <form id="userForm">
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit">Ajouter</button>
        <p id="userMessage"></p>
      </form>
    </section>

    <section class="section">
      <h2>Liste des utilisateurs</h2>
      <table>
        <thead>
          <tr>
            <th>Nom d'utilisateur</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </section>
  </main>

  <script src="js/users.js"></script>
</body>
</html>
