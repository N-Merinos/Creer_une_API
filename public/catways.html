<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catways - Port Russell</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Port de Plaisance Russell</h1>
  </header>

  <nav>
    <a href="/dashboard.html">Tableau de bord</a>
    <a href="/reservations.html">Réservations</a>
    <a href="/users.html">Utilisateurs</a>
    <a href="/api-docs">Documentation API</a>
    <a href="#" id="logoutBtn">Se déconnecter</a>
  </nav>

  <main>
    <section class="section">
      <h2>Ajouter un catway</h2>
      <form id="catwayForm">
        <div class="form-group">
          <label for="catwayNumber">Numéro</label>
          <input type="number" id="catwayNumber" required>
        </div>
        <div class="form-group">
          <label for="catwayType">Type</label>
          <select id="catwayType">
            <option value="long">Long</option>
            <option value="short">Short</option>
          </select>
        </div>
        <div class="form-group">
          <label for="catwayState">État</label>
          <input type="text" id="catwayState" required>
        </div>
        <button type="submit">Ajouter</button>
        <p id="catwayMessage"></p>
      </form>
    </section>

    <section class="section">
      <h2>Liste des catways</h2>
      <table>
        <thead>
          <tr>
            <th>Numéro</th>
            <th>Type</th>
            <th>État</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="catwaysBody"></tbody>
      </table>
    </section>
  </main>

  <script src="js/catways.js"></script>
</body>
</html>
